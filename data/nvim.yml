id: nvim
name: Neovim
description: Modal editing keys and commands.
sections:
  - name: Motions
    entries:
      - { keys: "h j k l", mode: [N, V], desc: "← ↓ ↑ →", tags: [move] }
      - { keys: "w", mode: [N, V], desc: "Jump → next word", tags: [move, word] }
      - { keys: "b", mode: [N, V], desc: "Jump ← prev word", tags: [move, word] }
      - { keys: "e", mode: [N, V], desc: "Jump → word end", tags: [move, word] }
      - { keys: "0", mode: [N, V], desc: "Line start", tags: [move, line] }
      - { keys: "^", mode: [N, V], desc: "Line start (non-blank)", tags: [move, line] }
      - { keys: "$", mode: [N, V], desc: "Line end", tags: [move, line] }
      - { keys: "gg", mode: [N, V], desc: "File start", tags: [move, file] }
      - { keys: "G", mode: [N, V], desc: "File end", example: "42G goes to line 42", tags: [move, file] }
      - { keys: "%", mode: [N, V], desc: "Matching bracket", tags: [move, bracket] }
      - { keys: "{ }", mode: [N, V], desc: "← ¶ / ¶ → (paragraph)", tags: [move] }
      - { keys: "f{char}", mode: [N, V], desc: "Jump → char", example: "fx jumps to the next x; ; repeats", tags: [move, find] }
      - { keys: "Ctrl-d / Ctrl-u", mode: [N, V], desc: "Page ↓ / ↑ (half)", tags: [scroll] }
  - name: Editing
    entries:
      - { keys: "i / a", mode: [N], desc: "Insert / Append", tags: [insert] }
      - { keys: "I / A", mode: [N], desc: "Insert line start / end", tags: [insert] }
      - { keys: "o / O", mode: [N], desc: "New line ↓ / ↑", tags: [insert, line] }
      - { keys: "x", mode: [N, V], desc: "Delete char", tags: [delete] }
      - { keys: "dd", mode: [N], desc: "Delete line", tags: [delete, line] }
      - { keys: "yy", mode: [N], desc: "Yank line", tags: [yank, line] }
      - { keys: "p / P", mode: [N], desc: "Paste ↓ / ↑", tags: [paste] }
      - { keys: "cw", mode: [N], desc: "Change word", tags: [change, word] }
      - { keys: "ciw", mode: [N], desc: "Change inner word", example: "ci\" changes the text inside quotes", tags: [change, textobject] }
      - { keys: "u", mode: [N], desc: "Undo", tags: [undo] }
      - { keys: "Ctrl-r", mode: [N], desc: "Redo", tags: [undo] }
      - { keys: ".", mode: [N], desc: "Repeat change", tags: [repeat] }
      - { keys: ">> / <<", mode: [N], desc: "Indent / Unindent", tags: [indent] }
      - { keys: "Ctrl-w", mode: [I, C], desc: "Delete word ←", tags: [delete, word] }
      - { keys: "Ctrl-r {reg}", mode: [I, C], desc: "Insert register", example: "Ctrl-r 0 pastes the last yank", tags: [register, paste] }
  - name: Visual
    entries:
      - { keys: "v", mode: [N], desc: "Visual (char)", tags: [visual] }
      - { keys: "V", mode: [N], desc: "Visual (line)", tags: [visual] }
      - { keys: "Ctrl-v", mode: [N], desc: "Visual (block)", example: "Ctrl-v, select lines, I, type, Esc inserts on every line", tags: [visual, block] }
      - { keys: "o", mode: [V], desc: "Other end of selection", tags: [visual] }
      - { keys: "gv", mode: [N], desc: "Reselect last", tags: [visual] }
  - name: Search & Replace
    entries:
      - { keys: "/pattern", mode: [N], desc: "Search ↓", tags: [search] }
      - { keys: "?pattern", mode: [N], desc: "Search ↑", tags: [search] }
      - { keys: "n / N", mode: [N], desc: "Next / Prev match", tags: [search] }
      - { keys: "*", mode: [N], desc: "Search word under cursor", tags: [search] }
      - { keys: ":%s/old/new/g", mode: [C], desc: "Replace all", example: ":%s/foo/bar/gc confirms each replacement", tags: [replace] }
      - { keys: ":noh", mode: [C], desc: "Clear highlight", tags: [search] }
  - name: Files & Windows
    entries:
      - { keys: ":w", mode: [C], desc: "Save", tags: [file] }
      - { keys: ":q", mode: [C], desc: "Quit", tags: [file] }
      - { keys: ":wq", mode: [C], desc: "Save + quit", tags: [file] }
      - { keys: ":q!", mode: [C], desc: "Quit, discard", tags: [file] }
      - { keys: ":e {file}", mode: [C], desc: "Open file", tags: [file] }
      - { keys: ":sp / :vsp", mode: [C], desc: "Split ─ / │", tags: [window] }
      - { keys: "Ctrl-w h/j/k/l", mode: [N], desc: "Focus window ← ↓ ↑ →", tags: [window] }
      - { keys: ":bn / :bp", mode: [C], desc: "Buffer → / ←", tags: [buffer] }
  - name: Macros & Registers
    entries:
      - { keys: "q{reg}", mode: [N], desc: "Record macro", example: "qa ... q records into a", tags: [macro] }
      - { keys: "@{reg}", mode: [N], desc: "Play macro", example: "@a, then @@ to repeat; 10@a runs it 10 times", tags: [macro] }
      - { keys: "\"{reg}y", mode: [N, V], desc: "Yank → register", example: "\"ayy yanks the line into register a", tags: [register, yank] }
      - { keys: "\"+y", mode: [N, V], desc: "Yank → clipboard", tags: [register, clipboard] }
