id: zsh
name: Zsh
description: Line-editor shortcuts, history, globbing and expansion.
sections:
  - name: Line Editing
    entries:
      - { keys: "Ctrl-a / Ctrl-e", desc: "Line start / end", tags: [move] }
      - { keys: "Alt-b / Alt-f", desc: "Word ← / →", tags: [move, word] }
      - { keys: "Ctrl-u", desc: "Delete → line start", tags: [delete] }
      - { keys: "Ctrl-k", desc: "Delete → line end", tags: [delete] }
      - { keys: "Ctrl-w", desc: "Delete word ←", tags: [delete, word] }
      - { keys: "Ctrl-y", desc: "Paste deleted", tags: [paste] }
      - { keys: "Ctrl-l", desc: "Clear screen", tags: [screen] }
      - { keys: "Ctrl-x Ctrl-e", desc: "Edit in $EDITOR", tags: [editor] }
  - name: History
    entries:
      - { keys: "Ctrl-r", desc: "Search history", tags: [history, search] }
      - { keys: "!!", desc: "Repeat last cmd", example: "sudo !! reruns it with sudo", tags: [history] }
      - { keys: "!$", desc: "Last arg", example: "mkdir foo && cd !$", tags: [history] }
      - { keys: "!<string>", desc: "Last cmd starting with…", example: "!git", tags: [history] }
      - { keys: "Alt-.", desc: "Last arg (cycle)", tags: [history] }
      - { keys: "history -E 1", desc: "History + timestamps", tags: [history] }
      - { keys: "fc -e - old=new", desc: "Rerun with substitution", example: "fc -e - foo=bar", tags: [history] }
  - name: Globbing
    entries:
      - { keys: "**/*.js", desc: "Recursive glob", tags: [glob] }
      - { keys: "*(.)", desc: "Files only", tags: [glob, qualifier] }
      - { keys: "*(/)", desc: "Dirs only", tags: [glob, qualifier] }
      - { keys: "*(om[1,5])", desc: "5 newest", example: "ls *(om[1,5])", tags: [glob, qualifier] }
      - { keys: "*~*.txt", desc: "Exclude pattern", tags: [glob, exclude] }
      - { keys: "file<1-10>", desc: "Numeric range", example: "ls file<1-10>.log", tags: [glob] }
  - name: Expansion
    entries:
      - { keys: "{a,b,c}", desc: "Brace expand", example: "cp file.{txt,bak}", tags: [expansion] }
      - { keys: "{1..5}", desc: "Number range", tags: [expansion] }
      - { keys: "$(cmd)", desc: "Command output", tags: [expansion] }
      - { keys: "<(cmd)", desc: "Output as file", example: "diff <(ls a) <(ls b)", tags: [expansion] }
      - { keys: "${var:-default}", desc: "Default if unset", tags: [expansion, variable] }
      - { keys: "${var##*/}", desc: "Strip prefix", example: "${path##*/} gives the basename", tags: [expansion, variable] }
      - { keys: "${(U)var}", desc: "Uppercase", tags: [expansion, variable] }
  - name: Directories
    entries:
      - { keys: "cd -", desc: "Previous dir", tags: [navigate] }
      - { keys: "dirs -v", desc: "Dir stack", tags: [navigate, stack] }
      - { keys: "cd ~2", desc: "Jump to stack entry", tags: [navigate, stack] }
      - { keys: "setopt AUTO_CD", desc: "cd by name only", tags: [navigate, option] }
      - { keys: "setopt AUTO_PUSHD", desc: "cd pushes stack", tags: [navigate, option] }
  - name: Aliases & Functions
    entries:
      - { keys: "alias ll='ls -lah'", desc: "Define alias", tags: [alias] }
      - { keys: "alias -g G='| grep'", desc: "Global alias", example: "ps aux G zsh", tags: [alias] }
      - { keys: "which <cmd>", desc: "Show resolution", tags: [inspect] }
      - { keys: "functions <name>", desc: "Show function", tags: [inspect, function] }
      - { keys: "source ~/.zshrc", desc: "Reload config", tags: [config] }
