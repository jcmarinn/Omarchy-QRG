id: docker
name: Docker
description: Container, image, volume and compose commands.
sections:
  - name: Containers
    entries:
      - { keys: "docker run -d --name web -p 8080:80 nginx", desc: "Run detached + port", tags: [run] }
      - { keys: "docker run -it --rm ubuntu bash", desc: "Run interactive, auto-remove", tags: [run, interactive] }
      - { keys: "docker ps", desc: "List running", example: "docker ps -a includes stopped ones", tags: [list] }
      - { keys: "docker stop <container>", desc: "Stop", tags: [lifecycle] }
      - { keys: "docker start <container>", desc: "Start", tags: [lifecycle] }
      - { keys: "docker rm <container>", desc: "Remove", example: "docker rm -f forces removal of a running one", tags: [lifecycle] }
      - { keys: "docker exec -it <container> sh", desc: "Shell into container", tags: [exec, interactive] }
      - { keys: "docker logs -f <container>", desc: "Follow logs", example: "docker logs --tail 100 -f web", tags: [logs] }
      - { keys: "docker inspect <container>", desc: "Inspect (JSON)", tags: [inspect] }
      - { keys: "docker stats", desc: "Live resource usage", tags: [monitor] }
      - { keys: "docker cp <container>:/path ./path", desc: "Copy host ↔ container", tags: [files] }
  - name: Images
    entries:
      - { keys: "docker images", desc: "List images", tags: [list] }
      - { keys: "docker pull <image>:<tag>", desc: "Pull", tags: [registry] }
      - { keys: "docker build -t name:tag .", desc: "Build", tags: [build] }
      - { keys: "docker tag <image> <repo>:<tag>", desc: "Tag", tags: [registry] }
      - { keys: "docker push <repo>:<tag>", desc: "Push", tags: [registry] }
      - { keys: "docker rmi <image>", desc: "Remove image", tags: [cleanup] }
      - { keys: "docker history <image>", desc: "Show layers", tags: [inspect] }
  - name: Volumes & Networks
    entries:
      - { keys: "docker volume ls", desc: "List volumes", tags: [volume] }
      - { keys: "docker volume create <name>", desc: "Create volume", tags: [volume] }
      - { keys: "docker run -v <name>:/data <image>", desc: "Mount volume", example: "docker run -v $(pwd):/app node:22 bind-mounts the current dir", tags: [volume, run] }
      - { keys: "docker network ls", desc: "List networks", tags: [network] }
      - { keys: "docker network create <name>", desc: "Create network", tags: [network] }
      - { keys: "docker network connect <network> <container>", desc: "Attach container", tags: [network] }
  - name: Compose
    entries:
      - { keys: "docker compose up -d", desc: "Up (detached)", example: "docker compose up -d --build rebuilds images first", tags: [compose] }
      - { keys: "docker compose down", desc: "Down", example: "docker compose down -v also removes volumes", tags: [compose] }
      - { keys: "docker compose ps", desc: "List services", tags: [compose, list] }
      - { keys: "docker compose logs -f <service>", desc: "Follow service logs", tags: [compose, logs] }
      - { keys: "docker compose exec <service> sh", desc: "Shell into service", tags: [compose, exec] }
      - { keys: "docker compose restart <service>", desc: "Restart service", tags: [compose, lifecycle] }
  - name: Cleanup
    entries:
      - { keys: "docker system df", desc: "Disk usage", tags: [cleanup, monitor] }
      - { keys: "docker container prune", desc: "Remove stopped containers", tags: [cleanup] }
      - { keys: "docker image prune -a", desc: "Remove unused images", tags: [cleanup] }
      - { keys: "docker system prune", desc: "Remove all unused", example: "docker system prune -a --volumes is the aggressive version", tags: [cleanup] }
