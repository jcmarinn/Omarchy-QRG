id: docker
name: Docker
description: Container, image, volume and compose commands.
sections:
  - name: Containers
    entries:
      - { keys: "docker run -d --name web -p 8080:80 nginx", desc: "Run a container in the background with a name and a published port", tags: [run] }
      - { keys: "docker run -it --rm ubuntu bash", desc: "Run an interactive throwaway container", tags: [run, interactive] }
      - { keys: "docker ps", desc: "List running containers", example: "docker ps -a includes stopped ones", tags: [list] }
      - { keys: "docker stop <container>", desc: "Stop a running container", tags: [lifecycle] }
      - { keys: "docker start <container>", desc: "Start a stopped container", tags: [lifecycle] }
      - { keys: "docker rm <container>", desc: "Remove a stopped container", example: "docker rm -f forces removal of a running one", tags: [lifecycle] }
      - { keys: "docker exec -it <container> sh", desc: "Open a shell in a running container", tags: [exec, interactive] }
      - { keys: "docker logs -f <container>", desc: "Follow container logs", example: "docker logs --tail 100 -f web", tags: [logs] }
      - { keys: "docker inspect <container>", desc: "Show low-level details as JSON", tags: [inspect] }
      - { keys: "docker stats", desc: "Live CPU / memory usage of containers", tags: [monitor] }
      - { keys: "docker cp <container>:/path ./path", desc: "Copy files between container and host", tags: [files] }
  - name: Images
    entries:
      - { keys: "docker images", desc: "List local images", tags: [list] }
      - { keys: "docker pull <image>:<tag>", desc: "Download an image", tags: [registry] }
      - { keys: "docker build -t name:tag .", desc: "Build an image from the Dockerfile in the current directory", tags: [build] }
      - { keys: "docker tag <image> <repo>:<tag>", desc: "Add a tag to an image", tags: [registry] }
      - { keys: "docker push <repo>:<tag>", desc: "Upload an image to a registry", tags: [registry] }
      - { keys: "docker rmi <image>", desc: "Remove an image", tags: [cleanup] }
      - { keys: "docker history <image>", desc: "Show the layers of an image", tags: [inspect] }
  - name: Volumes & Networks
    entries:
      - { keys: "docker volume ls", desc: "List volumes", tags: [volume] }
      - { keys: "docker volume create <name>", desc: "Create a named volume", tags: [volume] }
      - { keys: "docker run -v <name>:/data <image>", desc: "Mount a named volume into a container", example: "docker run -v $(pwd):/app node:22 bind-mounts the current dir", tags: [volume, run] }
      - { keys: "docker network ls", desc: "List networks", tags: [network] }
      - { keys: "docker network create <name>", desc: "Create a user-defined bridge network", tags: [network] }
      - { keys: "docker network connect <network> <container>", desc: "Attach a running container to a network", tags: [network] }
  - name: Compose
    entries:
      - { keys: "docker compose up -d", desc: "Create and start all services in the background", example: "docker compose up -d --build rebuilds images first", tags: [compose] }
      - { keys: "docker compose down", desc: "Stop and remove the services and networks", example: "docker compose down -v also removes volumes", tags: [compose] }
      - { keys: "docker compose ps", desc: "List the project's containers", tags: [compose, list] }
      - { keys: "docker compose logs -f <service>", desc: "Follow logs of a service", tags: [compose, logs] }
      - { keys: "docker compose exec <service> sh", desc: "Open a shell in a running service", tags: [compose, exec] }
      - { keys: "docker compose restart <service>", desc: "Restart a service", tags: [compose, lifecycle] }
  - name: Cleanup
    entries:
      - { keys: "docker system df", desc: "Show disk usage of images, containers and volumes", tags: [cleanup, monitor] }
      - { keys: "docker container prune", desc: "Remove all stopped containers", tags: [cleanup] }
      - { keys: "docker image prune -a", desc: "Remove all images not used by a container", tags: [cleanup] }
      - { keys: "docker system prune", desc: "Remove stopped containers, unused networks and dangling images", example: "docker system prune -a --volumes is the aggressive version", tags: [cleanup] }
